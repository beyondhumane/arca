[package]
name = "arca-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Interfaz grafica de Arca"

[[bin]]
name = "arca-gui"
path = "src/main.rs"

[dependencies]
arca-rar.workspace = true
arca-iso.workspace = true
arca-brand.workspace = true
arca-core.workspace = true
arca-zip.workspace = true
arca-tar.workspace = true
arca-stream.workspace = true
arca-compare.workspace = true
arca-7z.workspace = true
arca-icons.workspace = true
rayon.workspace = true
tempfile = "3"

# Dialogos de fichero nativos. Es lo unico que toca la plataforma.
rfd = "0.17"
skrifa = { version = "0.46", default-features = false, features = ["std"] }
flate2.workspace = true

# Solo los formatos que alguien mete en un zip y espera poder mirar. Sin las
# features por defecto: son una docena de decodificadores y cada uno es peso en
# el binario y superficie que mantener.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "webp",
] }
sys-locale = "0.3"

# The window, the widgets and the accessibility tree. Glow is the smaller of
# eframe's two GPU back ends and the one that starts fastest on old drivers.
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
egui-phosphor = { version = "0.14", default-features = false, features = ["regular"] }
# SHA-256 para comprobar lo que se baja antes de ejecutarlo. RustCrypto, safe
# Rust puro, la misma familia que el sha1 del cifrado de arca-zip.
sha2 = "0.11"
# The saved passwords file: Argon2id stretches the master password into a key,
# AES-256-GCM seals the list with it. Both RustCrypto and safe Rust, and
# aes-gcm reuses the aes crate arca-zip already builds. Only this crate takes
# them, so nothing under arca-core or arca-rar gains a dependency.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
getrandom = "0.4"
zeroize = "1"

# CF_HDROP on the system clipboard, so Ctrl+C here pastes files in the
# Explorer. A thin wrapper over the four clipboard calls Win32 has; taking the
# `windows` crate for it would pull a far larger dependency in for the same
# work, and writing it by hand would mean unsafe in a crate that forbids it.
[target."cfg(windows)".dependencies]
clipboard-win = "5"

# The same list of files on the Linux clipboard, as text/uri-list, for Thunar,
# Dolphin, Nautilus and the rest. egui already builds arboard for its text
# clipboard, so this adds no crate, only lets the window ask it for files
# too.
[target."cfg(target_os = \"linux\")".dependencies]
arboard = { version = "3.6", default-features = false }

[target."cfg(windows)".build-dependencies]
winresource = "0.1"

# Arrastrar entradas fuera de la ventana. Solo-Windows, y en su propio crate
# porque es COM y unsafe, que aqui no se admite.
[target."cfg(windows)".dependencies.arca-drag]
path = "../arca-drag"

# Preguntar si hay una version nueva. En todas las plataformas: fuera de
# Windows el crate compila vacio y contesta que no, que es lo mismo que
# contesta una maquina sin red.
[dependencies.arca-net]
path = "../arca-net"

[features]
rar = ["arca-rar/rar"]
default = ["codecs-native", "rar"]
codecs-native = ["arca-zip/codecs-native", "arca-7z/codecs-native", "arca-stream/codecs-native"]
