[package]
name = "arca-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Arca: archivador rapido y seguro"

[[bin]]
name = "arca"
path = "src/main.rs"

[dependencies]
arca-rar.workspace = true
arca-iso.workspace = true
arca-core.workspace = true
arca-zip.workspace = true
arca-tar.workspace = true
arca-xz.workspace = true
arca-7z.workspace = true
flate2.workspace = true
clap.workspace = true
rayon.workspace = true

[target."cfg(unix)".dependencies]
signal-hook = { version = "=0.4.5", optional = true }

[target."cfg(windows)".dependencies]
ctrlc = { version = "=3.5.2", optional = true }

[features]
rar = ["arca-rar/rar", "dep:ctrlc", "dep:signal-hook"]
default = ["codecs-native", "rar"]
codecs-native = ["arca-zip/codecs-native", "arca-7z/codecs-native"]

[target."cfg(windows)".build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
