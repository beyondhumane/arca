[package]
name = "arca-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Arca: archivador rapido y seguro"

[[bin]]
name = "arca"
path = "src/main.rs"

[dependencies]
arca-rar.workspace = true
arca-iso.workspace = true
arca-extra.workspace = true
arca-disk.workspace = true
arca-core.workspace = true
arca-zip.workspace = true
arca-tar.workspace = true
arca-stream.workspace = true
arca-compare.workspace = true
arca-bench.workspace = true
arca-7z.workspace = true
flate2.workspace = true
clap.workspace = true
rayon.workspace = true

# Ctrl-C and SIGTERM handling. Every build needs it, not only the one with
# RAR: `arca bench --codecs` stops on it too and prints what it measured.
[target."cfg(unix)".dependencies]
signal-hook = "=0.4.6"

[target."cfg(windows)".dependencies]
ctrlc = "=3.5.3"

[features]
rar = ["arca-rar/rar"]
default = ["codecs-native", "rar"]
codecs-native = ["arca-zip/codecs-native", "arca-7z/codecs-native", "arca-stream/codecs-native"]

[target."cfg(windows)".build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
