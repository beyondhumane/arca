[package]
name = "arca-stream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Flujos gzip, XZ, bzip2 y Zstandard sueltos o con un TAR dentro"

[dependencies]
arca-core.workspace = true
arca-tar.workspace = true
arca-xz.workspace = true
bzip2.workspace = true
flate2.workspace = true
# Zstandard es libzstd, C, y entra con la misma bandera que en arca-zip.
zstd = { workspace = true, optional = true }

[features]
default = ["codecs-native"]
codecs-native = ["dep:zstd"]

[lints.rust]
unsafe_code = "forbid"
