# Weekly, and grouped: one pull request per ecosystem and not one per crate.
version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/windows/arca-shell"]
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      site:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Its ref names the toolchain (MSRV 1.95 in ci.yml), not an action version.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
