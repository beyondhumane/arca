name: CI

# A change that only touches the site or the guide does not rebuild Rust; the
# Pages workflow checks those.
on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/pages.yml"
      - ".github/dependabot.yml"
  pull_request:
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/pages.yml"
      - ".github/dependabot.yml"

env:
  CARGO_TERM_COLOR: always
  # CI validates release code paths; the tag workflow pays for production LTO.
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  tests:
    name: Tests and interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Reference tools
        run: >-
          sudo apt-get update && sudo apt-get install -y zip unzip p7zip-full
          zstd genisoimage xorriso libarchive-tools
      - name: Window dependencies
        run: >-
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev
          libwayland-dev libxrandr-dev libxi-dev libgl1-mesa-dev
          libxcursor-dev libxinerama-dev libfontconfig1-dev

      # The GUI test binary is linked once, on Linux. Platform jobs validate
      # their release builds without linking this large GPUI test binary again.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: python3 arca-rar/tests/check-features.py
      - run: python3 packaging/rar-notices.py --check
      - run: cargo clippy --workspace --all-targets --no-default-features --features codecs-native -- -D warnings
      - run: cargo test --workspace --no-default-features --features codecs-native
      - name: Bounded RAR mutation campaign
        run: |
          cargo fmt --manifest-path arca-rar/fuzz/Cargo.toml -- --check
          cargo clippy --locked --manifest-path arca-rar/fuzz/Cargo.toml --all-targets -- -D warnings
          cargo build --locked --manifest-path arca-rar/fuzz/Cargo.toml
          python3 arca-rar/fuzz/run.py --runs 2000 --seed 140014 --seconds 300 --output "$RUNNER_TEMP/rar-fuzz"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["counts"]["executions"] == 2010 and len(r["baseline"]) == 10 and not r["failures"], "incomplete fuzz campaign"' "$RUNNER_TEMP/rar-fuzz/report.json"

      # Interoperability exercises the CLI; there is no reason to build GPUI
      # just to obtain arca for this check.
      - name: Build CLI without default features
        run: cargo build --no-default-features -p arca-cli
      - name: Build CLI with the default codecs
        run: cargo build -p arca-cli
      - name: Interoperability verified by hash
        run: ARCA="$GITHUB_WORKSPACE/target/debug/arca" bash interop.sh


  # rust-version in Cargo.toml is a promise; this job keeps it honest. Raise
  # both together when a dependency needs a newer compiler.
  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Window dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxrandr-dev
          libxi-dev libgl1-mesa-dev libxcursor-dev libxinerama-dev
          libfontconfig1-dev
      - run: cargo check --workspace --all-targets --locked
      - run: cargo check --workspace --all-targets --no-default-features --locked

  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # `windows/arca-shell` is outside the workspace and has a target directory
      # of its own, which the default configuration does not cache: without this
      # it rebuilt the `windows` crate on every run.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            windows/arca-shell -> target

      - name: Window dependencies
        if: matrix.os == 'ubuntu-latest'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxrandr-dev
          libxi-dev libgl1-mesa-dev libxcursor-dev libxinerama-dev
          libfontconfig1-dev

      # No `--target` here on purpose. It used to say
      # `--target x86_64-pc-windows-msvc` on Windows, which is the host triple
      # anyway, and it moved the artifacts to `target/<triple>/release`, where
      # the cache did not keep them: the job restored its cache and then rebuilt
      # all 381 crates, seven and a half minutes, on every run. Linux and macOS
      # rebuilt eight.
      - name: Build release binaries
        run: cargo build --release

      - name: Archive readers with default features
        run: |
          cargo test -p arca-core -p arca-7z -p arca-rar -p arca-cli --locked
          python3 arca-rar/tests/check-features.py

      - name: Release RAR smoke test
        shell: bash
        run: target/release/arca test arca-rar/tests/fixtures/volume.part4.rar

      # Official UnRAR and 7-Zip are reference decoders for the archives Arca
      # writes; the release binary is already built here. They are downloaded
      # for this job only, pinned by SHA-256, and never enter a build or a
      # release artifact.
      - name: Official RAR reference decoders
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p "$RUNNER_TEMP/rar-tools"
          cd "$RUNNER_TEMP/rar-tools"
          curl -fsSL -o rar.tgz https://www.rarlab.com/rar/rarlinux-x64-712.tar.gz
          curl -fsSL -o 7z.txz https://github.com/ip7z/7zip/releases/download/24.09/7z2409-linux-x64.tar.xz
          sha256sum -c <<'SUMS'
          630d9a9dd131367273667bee079ad103f469f1b7cdbc9b42a4f283cc2993bab2  rar.tgz
          914c7e20ad5ef8e4d3cf08620ff8894b28fe11b7eb99809d6930870fbe48a281  7z.txz
          SUMS
          tar -xzf rar.tgz rar/unrar
          mkdir 7z && tar -xJf 7z.txz -C 7z 7zz
          echo "UNRAR=$PWD/rar/unrar" >> "$GITHUB_ENV"
          echo "SEVENZIP=$PWD/7z/7zz" >> "$GITHUB_ENV"
      - name: Bounded RAR creation smoke (seeded; --stress for the full campaign)
        if: matrix.os == 'ubuntu-latest'
        run: >-
          python3 arca-rar/tests/create-stress.py --arca target/release/arca
          --require-tools --seed 20261004 --output "$RUNNER_TEMP/rar-create-stress"
      - name: Keep RAR creation artifacts on failure
        if: failure() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: rar-create-stress
          path: ${{ runner.temp }}/rar-create-stress
          if-no-files-found: ignore

      - name: Shell extension
        if: matrix.os == 'windows-latest'
        working-directory: windows/arca-shell
        run: |
          cargo build --release
          cargo test
          cargo clippy --release --all-targets -- -D warnings
