name: PR labels

# Labels each pull request after the Conventional Commit type in its title, so
# the generated release notes can group it (see .github/release.yml).
# `pull_request_target` gives the token write access on PRs from forks too; it
# is safe here because nothing from the PR is checked out or run, and the
# title only reaches the script through an environment variable.
on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label from the title
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.pull_request.title }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          TYPE=$(printf '%s' "$TITLE" | sed -nE 's/^([a-z]+)(\([^)]*\))?!?:.*/\1/p')
          case "$TYPE" in
            feat) LABEL=enhancement ;;
            fix) LABEL=bug ;;
            perf) LABEL=performance ;;
            docs) LABEL=documentation ;;
            build|chore|ci|refactor|revert|style|test) LABEL=maintenance ;;
            *) echo "no Conventional Commit type in: $TITLE"; exit 0 ;;
          esac
          OTHERS=$(printf '%s\n' enhancement bug performance documentation maintenance \
            | grep -vx "$LABEL" | paste -sd, -)
          gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label "$LABEL" --remove-label "$OTHERS"
