[package]
name = "arca-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Tipos comunes y lectura acotada para Arca"

[dependencies]
crc32fast.workspace = true
# Checksums for `arca hash` and the window. RustCrypto, safe Rust, the same
# family arca-zip already builds for its AES encryption.
sha1 = "0.11"
sha2 = "0.11"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
# The zone this machine is set to, with its daylight saving rules: a ZIP keeps
# its times as wall-clock time and nothing else, so turning them into instants
# and back needs the zone's history, which no format here carries.
jiff = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
