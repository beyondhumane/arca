[package]
name = "arca-setup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "El instalador de Arca"
publish = false

[[bin]]
name = "arca-setup"
path = "src/main.rs"

[dependencies]
arca-brand.workspace = true
arca-core.workspace = true
arca-zip.workspace = true
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
# Only the SVG loader: the backgrounds and the logo are vector art.
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
sys-locale = "0.3"

[target."cfg(windows)".dependencies]
winreg = "0.56"
arca-notify = { path = "../arca-notify" }




[target."cfg(windows)".build-dependencies]
winresource = "0.1"
