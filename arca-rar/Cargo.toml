[package]
name = "arca-rar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "RAR adapter for Arca: reads RAR/CBR, creates new RAR5 archives"

[features]
default = []
rar = ["dep:rars", "dep:tempfile", "dep:libc"]

[dependencies]
arca-core.workspace = true
rars = { version = "=0.10.0", default-features = false, features = ["encryption", "write"], optional = true }
tempfile = { version = "3", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
