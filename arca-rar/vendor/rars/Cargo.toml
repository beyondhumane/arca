[package]
edition = "2021"
rust-version = "1.89"
name = "rars"
version = "0.10.2"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "High-level Rust API for reading, extracting, writing, and repairing RAR archives."
homepage = "https://github.com/bitplane/rars"
documentation = "https://docs.rs/rars"
readme = "README.md"
keywords = [
    "rar",
    "archive",
    "compression",
]
categories = ["compression"]
license = "Apache-2.0"
repository = "https://github.com/bitplane/rars"

[package.metadata.docs.rs]
all-features = true

[features]
default = [
    "write",
    "parallel",
    "recovery",
    "encryption",
]
