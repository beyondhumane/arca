[dependencies.aes]
version = "0.9"
features = ["zeroize"]
optional = true

[dependencies.aho-corasick]
version = "1.1"

[dependencies.getrandom]
version = "0.4"
optional = true

[dependencies.hmac]
version = "0.13"
optional = true

[dependencies.sha1]
version = "0.11"
optional = true

[dependencies.sha2]
version = "0.11"
optional = true

[dependencies.zeroize]
version = "1.8"
features = [
    "alloc",
    "zeroize_derive",
]
optional = true
default-features = false

[dev-dependencies.criterion]
version = "0.8"
features = ["cargo_bench_support"]
default-features = false

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies.getrandom]
version = "0.4"
features = ["wasm_js"]
optional = true

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies.rayon]
version = "1.12.0"
optional = true

[target."cfg(unix)".dev-dependencies.libc]
version = "0.2"

