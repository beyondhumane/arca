    "dep:aes",
    "dep:hmac",
    "dep:sha1",
    "dep:sha2",
    "dep:zeroize",
]
parallel = ["dep:rayon"]
recovery = ["dep:getrandom"]
write = ["dep:getrandom"]

[lib]
