[workspace]
resolver = "2"
members = [
    "crates/arca-core",
    "crates/arca-zip",
    "crates/arca-tar",
    "crates/arca-xz",
    "crates/arca-stream",
    "crates/arca-compare",
    "crates/arca-bench",
    "crates/arca-7z",
    "crates/arca-rar",
    "crates/arca-iso",
    "crates/arca-extra",
    "crates/arca-disk",
    "crates/arca-cli",
    "crates/arca-gui",
    "crates/arca-setup",
    "crates/arca-brand",
    "crates/arca-icons",
    "crates/arca-drag",
    "crates/arca-notify",
    "crates/arca-net",
    "crates/arca-sfx",
]
# Solo compila en Windows: se queda fuera del workspace para que
# `cargo build` siga funcionando en Linux y macOS.
exclude = ["windows/arca-shell", "crates/arca-7z/vendor/sevenz-rust2", "crates/arca-rar/vendor/rars", "crates/arca-xz/vendor/lzma-rust2"]

[workspace.package]
version = "1.0.1"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
authors = ["Proyecto Arca"]

[workspace.dependencies]
# Sin `version`, solo `path`. Llevaban "0.1" y al subir el workspace a 0.2.0 se
# quedaron atras: cargo dejo de resolver y CI se cayo en las tres plataformas.
# Un numero que hay que sincronizar a mano es un fallo esperando a ocurrir, y
# aqui no aporta nada porque estos crates no se publican en crates.io. Si algun
# dia se publican, hay que devolver el `version` a los tres.
arca-core = { path = "crates/arca-core" }
arca-zip  = { path = "crates/arca-zip", default-features = false }
arca-tar  = { path = "crates/arca-tar" }
arca-xz   = { path = "crates/arca-xz" }
arca-stream = { path = "crates/arca-stream", default-features = false }
arca-7z   = { path = "crates/arca-7z", default-features = false }
arca-rar = { path = "crates/arca-rar" }
arca-iso = { path = "crates/arca-iso" }
arca-extra = { path = "crates/arca-extra" }
arca-disk = { path = "crates/arca-disk" }
arca-compare = { path = "crates/arca-compare" }
arca-bench = { path = "crates/arca-bench" }
arca-icons = { path = "crates/arca-icons" }
arca-brand = { path = "crates/arca-brand" }
# DEFLATE: zlib-rs, la implementacion en Rust mas rapida medida (ver diseno S02)
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# bzip2: libbz2-rs-sys, el port a Rust de libbzip2. Sin compilador de C, asi que
# no necesita la bandera codecs-native.
bzip2 = "0.6.1"
crc32fast = "1"
# Zstandard: bindings a libzstd, con su multihilo interno activado.
zstd = { version = "0.14", features = ["zstdmt"] }
rayon = "1"
clap = { version = "4", features = ["derive"] }

# `cargo run` compila sin optimizar, y eso en la ventana no es "un poco mas lento":
# el layout de egui, el modelador de texto y el teselador rehacen su trabajo
# en cada fotograma, y a opt-level 0 eso se ve como tirones al arrastrar y al
# marcar. Nada de esto es codigo de Arca ni se depura nunca, asi que las
# dependencias van optimizadas tambien en depuracion.
[profile.dev.package."*"]
opt-level = 3

# Y el codigo de Arca a 1, que es lo que necesitan el ordenado de la lista y el
# recorrido de las entradas para no notarse. A este nivel el depurador sigue
# parando donde se le dice.
[profile.dev]
opt-level = 1

# Perfil agresivo: requisito R1 (arranque) y R3/R4 (rendimiento)
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Cargo ya fuerza unwind en los perfiles de test y bench, asi que poner
# `panic` aqui no hacia nada salvo un aviso en cada compilacion.
[profile.bench]
inherits = "release"

[patch.crates-io]
sevenz-rust2 = { path = "crates/arca-7z/vendor/sevenz-rust2" }
rars = { path = "crates/arca-rar/vendor/rars" }
lzma-rust2 = { path = "crates/arca-xz/vendor/lzma-rust2" }
